<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>QuaverStreamCompanion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c084fc"/>
            <stop offset="1" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#logo-grad)"/>
        <rect x="7" y="13" width="3.5" height="12" rx="1.75" fill="#0e0b16"/>
        <rect x="12.75" y="7" width="3.5" height="18" rx="1.75" fill="#0e0b16"/>
        <rect x="18.5" y="10" width="3.5" height="15" rx="1.75" fill="#0e0b16"/>
        <rect x="24.25" y="16" width="3.5" height="9" rx="1.75" fill="#e5a00d"/>
      </svg>
      <span class="wordmark"><span class="wm-accent">Quaver</span><span>StreamCompanion</span></span>
    </div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<script src="api.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="pages/status.js"></script>
<script src="pages/overlay-url.js"></script>
<script src="pages/overlays.js"></script>
<script src="pages/history-model.js"></script>
<script src="pages/history.js"></script>
<script src="pages/settings-model.js"></script>
<script src="pages/settings.js"></script>
</body>
</html>
