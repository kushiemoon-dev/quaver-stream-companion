<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSC judgment curve</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/overlays/overlay.css">
<script src="/overlays/i18n.js"></script>
<script src="/overlays/model.js"></script>
<script src="/overlays/common.js"></script>
</head>
<body>
<div id="card" class="card fill fit hidden"></div>
<script>
  const params = qscParams;
  const SVG_NS = ['http:', '', 'www.w3.org', '2000', 'svg'].join('/');
  const WIDTH = 480;
  const HEIGHT = 150;
  const MISS_LEN = 8;
  const FETCH_TIMEOUT_MS = 4000;
  const card = document.getElementById('card');
  document.title = qscT('curve.title');
  const autohide = qscAutohide(function () { card.classList.add('hidden'); });
  const gate = qscModel.createIdGate();
  let inflight = null;

  function svg(tag, attrs, text) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function draw(timeline) {
    const v = qscModel.timelineView(timeline, WIDTH, HEIGHT, params.lang);
    if (!v) {
      card.classList.add('hidden');
      return;
    }
    const label = qscT('curve.label') + ' ' + v.final + ', ' + qscT('curve.misses') + ' ' + v.misses.length;
    const root = svg('svg', { class: 'curve', viewBox: '0 0 ' + WIDTH + ' ' + HEIGHT, role: 'img', 'aria-label': label });
    root.appendChild(svg('title', {}, label));
    root.appendChild(svg('line', { class: 'axis', x1: v.left, x2: v.right, y1: v.yTop, y2: v.yTop }));
    root.appendChild(svg('line', { class: 'axis', x1: v.left, x2: v.right, y1: v.yBottom, y2: v.yBottom }));
    root.appendChild(svg('text', { class: 'tick', x: v.left - 4, y: v.yTop + 4, 'text-anchor': 'end' }, String(v.yMax)));
    root.appendChild(svg('text', { class: 'tick', x: v.left - 4, y: v.yBottom + 4, 'text-anchor': 'end' }, String(v.yMin)));
    v.misses.forEach(function (x) {
      root.appendChild(svg('line', { class: 'miss', x1: x.toFixed(1), x2: x.toFixed(1), y1: v.yBottom - MISS_LEN, y2: v.yBottom }));
    });
    const path = v.points.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    root.appendChild(svg('polyline', { class: 'line-path', points: path }));
    root.appendChild(svg('text', { class: 'final', x: v.right, y: v.yTop - 3, 'text-anchor': 'end' }, v.final));
    card.replaceChildren(root);
    card.classList.remove('hidden');
    autohide.touch();
  }

  function load(result) {
    const id = result && result.score ? result.score.id : null;
    if (!Number.isInteger(id) || id < 1) return;
    if (inflight) inflight.abort();
    const ctl = new AbortController();
    inflight = ctl;
    const timer = setTimeout(function () { ctl.abort(); }, FETCH_TIMEOUT_MS);
    fetch('/api/scores/' + id + '/timeline', { signal: ctl.signal, credentials: 'same-origin' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (timeline) { if (inflight === ctl) draw(timeline); })
      .catch(function () { if (inflight === ctl) card.classList.add('hidden'); })
      .then(function () {
        clearTimeout(timer);
        if (inflight === ctl) inflight = null;
      });
  }

  if (params.demo) {
    const demo = Array.from({ length: 120 }, function (_, i) { return 100 - 3 * Math.exp(-i / 12) - i * 0.015; });
    draw({ total: 1200, points: demo, misses: [140, 410, 411, 800, 1010] });
  } else {
    qscConnect({
      'snapshot': function (d) { if (d.last_score && gate.fresh(d.last_score)) load(d.last_score); },
      'score.saved': function (r) { if (gate.fresh(r)) load(r); },
    });
  }
</script>
</body>
</html>
