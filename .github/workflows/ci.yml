name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: go vet ./...
      - run: go test -race "-coverprofile=cover.out" ./...
      - name: Go coverage floor
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Go statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 85) }' || { echo "Go coverage is below the 85% floor"; exit 1; }
      - run: node scripts/js-coverage.mjs --lines 95 --branches 90 --functions 95
