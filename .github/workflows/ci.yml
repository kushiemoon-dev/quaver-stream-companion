name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - run: go vet ./...
      - run: go test -race "-coverprofile=cover.out" ./...
      - name: Go coverage floor
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Go statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 85) }' || { echo "Go coverage is below the 85% floor"; exit 1; }
      - run: node scripts/js-coverage.mjs --lines 95 --branches 90 --functions 95
