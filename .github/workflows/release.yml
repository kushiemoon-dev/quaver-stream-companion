name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: go vet ./...
      - run: go test ./... -count=1
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          check-latest: false
      - name: Build archive
        env:
          TAG: ${{ github.ref_name }}
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: bash packaging/build-archive.sh "$TAG" "$GOOS_TARGET" "$GOARCH_TARGET" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
  appimage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          check-latest: false
      - name: Build AppImage
        env:
          TAG: ${{ github.ref_name }}
        run: bash packaging/build-appimage.sh "$TAG" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-appimage
          path: dist/*.AppImage
          if-no-files-found: error
  smoke-linux:
    needs: [build, appimage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The smoke fixture uses node:sqlite, which needs Node 22.13 or newer.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Run the release archive
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir extract
          tar -xzf dist/qsc_*_linux_"$ARCH".tar.gz -C extract
          bin=$(echo "$PWD"/extract/qsc_*_linux_"$ARCH"/qsc)
          file "$bin"
          node scripts/smoke/drive.mjs --bin "$bin" --layout local-share --expect-keys unsupported --expect-version "$TAG"
      - name: Run the AppImage
        if: matrix.arch == 'amd64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/*.AppImage
          node scripts/smoke/drive.mjs --bin "$(echo "$PWD"/dist/*.AppImage)" --layout local-share --expect-keys unsupported --expect-version "$TAG"
  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The smoke fixture uses node:sqlite, which needs Node 22.13 or newer.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-windows-amd64
          path: dist
      - name: Run the release zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Expand-Archive -Path (Get-ChildItem dist -Filter 'qsc_*_windows_amd64.zip').FullName -DestinationPath extract
          $bin = (Get-ChildItem extract -Recurse -Filter qsc.exe).FullName
          Write-Host "binary: $bin"
          node scripts/smoke/drive.mjs --bin $bin --quaver-dir "$env:RUNNER_TEMP\Quaver" --expect-keys supported --expect-version $env:TAG
  release:
    needs: [build, appimage, smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum qsc_* > checksums.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "invalid tag: $TAG" >&2; exit 2; }
          notes=docs/releases/$TAG.md
          args=(--draft --verify-tag --title "$TAG")
          if [ -s "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" "${args[@]}"
